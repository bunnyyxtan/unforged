<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Proof a photo is real. Not proof of who took it. Anonymous, hardware-signed photo seals on Midnight." />
    <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -12 24 24'%3E%3Ccircle r='11' fill='%23f7f3ea' stroke='%2398202b' stroke-width='1.6'/%3E%3Ccircle r='7' fill='none' stroke='%2398202b' stroke-width='.8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Apply the saved or system theme before first paint.
      try {
        var t = localStorage.getItem("unforged:theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) { /* storage unavailable: CSS default (paper) applies */ }
    </script>
    <title>Unforged · Proof a photo is real</title>
  </head>

    <div id="root"></div>
