<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Proof a photo is real. Not proof of who took it. Anonymous, hardware-signed photo seals on Midnight." />
    <meta name="theme-color" content="#f7f3ea" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Light by default; dark only when the visitor chose it.
      try {
        var t = localStorage.getItem("unforged:theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) { /* storage unavailable: CSS default (paper) applies */ }
    </script>
    <title>Unforged · Evidence without exposure</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Unforged needs JavaScript to fingerprint and seal photos in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
